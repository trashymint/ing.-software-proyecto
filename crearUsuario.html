<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Inicio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container">
        <div class="text-center">
            <h2>Crear cuenta</h2>
        </div>
        <div class="btn-group" role="group" aria-label="Basic radio toggle button group">
            <input type="radio" class="btn-check" name="btnradio" id="Cliente" autocomplete="off" checked>
            <label class="btn btn-outline-primary" for="Cliente">Personal</label>
            <input type="radio" class="btn-check" name="btnradio" id="Vendedor" autocomplete="off">
            <label class="btn btn-outline-primary" for="Vendedor">Vendedor</label>
        </div>
    </div>

    <div class="container mt-3">
        <div id="clienteContenido" style="display: block;">
            <div class="container-fluid text-center">
                <div class="row">
                    <div class="col">
                        <form>
                            <div style="margin-bottom: 80px;">
                                <label for="username" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="username" placeholder="Nombres y Apellidos">
                            </div>

                            <div style="margin-bottom: 80px;">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="correo" placeholder="@javeriana.edu.co">
                            </div>
                        </form>
                    </div>

                    <div class="col" style="margin-bottom: 24px;">
                        <div style="margin-bottom: 55px;">
                            <label for="inputPassword5" class="form-label">Contraseña</label>
                            <input type="password" id="inputPassword5" class="form-control"
                                aria-describedby="passwordHelpBlock">
                            <div id="passwordHelpBlock" class="form-text">
                                Mínimo 6 caracteres
                            </div>
                        </div>

                        <div style="margin-bottom: 55px;">
                            <label for="dato" class="form-label">ID institucional</label>
                            <input type="text" class="form-control" id="dato">
                        </div>

                        <div style="margin-bottom: 41px;">
                            <label for="cedula" class="form-label">Documento de identidad</label>
                            <input type="text" class="form-control" id="cedula">
                        </div>
                    </div>
                    
                    <div class="col">
                        <div style="margin-bottom: 80px;">
                            <label for="rol" class="form-label">Tipo de perfil</label>
                            <select class="form-select" id="rol" aria-label="size 4">
                                <option selected>Seleccione su tipo de perfil</option>
                                <option value="1">Estudiante</option>
                                <option value="2">Docente</option>
                                <option value="3">Empleado</option>
                                <option value="4">Egresado</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="faculty" class="form-label">Facultad</label>
                            <button type="button" class="btn btn-outline-primary form-control" data-bs-toggle="modal"
                                data-bs-target="#facultyModal">
                                Seleccionar Facultad
                            </button>
                        </div>

                        <div class="modal fade" id="facultyModal" tabindex="-1" aria-labelledby="facultyModalLabel"
                            aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="facultyModalLabel">Seleccionar Facultad</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <div class="mb-3">
                                            <input type="text" id="searchFaculty" class="form-control"
                                                placeholder="Buscar Facultad...">
                                        </div>
                                        <!-- Faculty List -->
                                        <ul id="facultyList" class="list-group">
                                            <li class="list-group-item">Medicina</li>
                                            <li class="list-group-item">Derecho</li>
                                            <li class="list-group-item">Ingeniería</li>
                                        </ul>

                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                            data-bs-dismiss="modal">Cerrar</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <script src="buscarFacultad.js"></script>
                    </div>

                    <button class="btn btn-primary" type="button" id="crear" disabled>Crear cuenta</button>

                </div>
            </div>
        </div>

        <div id="vendedorContenido" style="display: none;">
            <div class="container-fluid text-center">
                <div class="row">
                    <div class="col">
                        <form>
                            <div style="margin-bottom: 80px;">
                                <label for="username" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="username2" placeholder="Nombres y Apellidos">
                            </div>

                            <div style="margin-bottom: 80px;">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="correo2" placeholder="@javeriana.edu.co">
                            </div>

                            <div style="margin-bottom: 40px;">
                                <label for="cedula" class="form-label">Documento de identidad</label>
                                <input type="text" class="form-control" id="cedula2">
                            </div>
                        </form>
                    </div>

                    <div class="col">
                        <div style="margin-bottom: 55px;">
                            <label for="inputPassword5" class="form-label">Contraseña</label>
                            <input type="password" id="contra2" class="form-control"
                                aria-describedby="passwordHelpBlock">
                            <div id="passwordHelpBlock" class="form-text">
                                Mínimo 6 caracteres
                            </div>
                        </div>

                        <div style="margin-bottom: 80px;">
                            <label for="dato" class="form-label">ID institucional</label>
                            <input type="text" class="form-control" id="dato2">
                        </div>

                        <div>
                            <label for="rol" class="form-label">Tipo de perfil</label>
                            <select class="form-select" id="rol2" aria-label="size 4">
                                <option selected>Seleccione su tipo de perfil</option>
                                <option value="1">Estudiante</option>
                                <option value="2">Docente</option>
                                <option value="3">Empleado</option>
                                <option value="4">Egresado</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn btn-primary" type="button" id="crear2" disabled>Crear cuenta</button>

                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="text-center">
            <h2>¿Ya tienes cuenta?</h2>
            <a href="#" class="btn btn-primary">Iniciar sesión</a>
        </div>
    </div>

    <script src="validarFormularios.js"></script>
    <script src="tipoContenido.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
