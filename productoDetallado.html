<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Detalle del Producto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/plugins/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/css/basic.css">
</head>

<body>
    <header class="header">
        <div class="header-content container">
            <nav class="navigation">
                <a href="/" class="text-decoration-none">
                    <p class="logotipo">404<span> Error</span></p>
                </a>

                <div class="btn-cart">
                    <button type="button"><i class="fa-solid fa-cart-shopping icon-cart"></i></button>
                    <span id="cartCount">0</span>

                    <div class="cart">
                        <div class="cart-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Imagen</th>
                                        <th>Producto</th>
                                        <th>Precio</th>
                                        <th>Cantidad</th>
                                        <th>Eliminar</th>
                                    </tr>
                                </thead>
                                <tbody id="contentProducts">
                                    <tr>
                                        <td>
                                            <input type="number" min="1">
                                        </td>
                                        <td>
                                            <button type="button">X</button>
                                        </td>
                                    </tr>
                                </tbody>

                                <tfoot>
                                    <tr>
                                        <td colspan="5" class="total">
                                            <h4 class="heading-total">Total: <span id="total"></span></h4>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td colspan="5">
                                            <button type="button" id="emptyCart">Vaciar carrito</button>
                                        </td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main>
        
    </main>
    <div class="container mt-5">
        <div class="gallery-container">
            <!-- Miniaturas a la izquierda -->
            <div class="gallery-thumbs">
            </div>
            <!-- Imagen principal -->
            <div class="gallery-main">
                <img id="mainImage" src="" alt="Imagen principal">
            </div>
            <!-- Detalles del producto -->
            <div class="product-details ms-4">
                <h2></h2>
                <p class="text-muted"></p>
                <h4 class="text-primary"></h4>
                <p class="vendedor mb-1"></p>
                <button id="AddToCart" class="btn btn-success mt-3">Añadir al carrito</button>
                <a href="index.html" class="btn btn-secondary mt-3">Volver al catálogo</a>
            </div>
        </div>
    </div>
    <script src="assets\js\detallarProducto.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
