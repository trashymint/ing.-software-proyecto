<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Inicio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container">
        <h1 class="mt-5">Vender Producto</h1>
        <form id="venderForm" enctype="multipart/form-data">
            <label for="productImages" class="form-label">Fotos del producto</label>
            <div id="gallery" class="mb-3 d-flex flex-wrap gap-2"></div>
            <div class="mb-3">
                <input type="file" class="form-control" id="productImages" name="imagenes" multiple accept="image/*" required>
            </div>
            <div class="mb-3">
                <label for="productName" class="form-label">Nombre del Producto</label>
                <input type="text" class="form-control" id="productName" name="nombre" required>
            </div>
            <div class="mb-3">
                <label for="productDescription" class="form-label">Descripción</label>
                <textarea class="form-control" id="productDescription" name="descripcion" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label for="productPrice" class="form-label">Precio</label>
                <input type="number" class="form-control" id="productPrice" name="precio" required>
            </div>
            <div class="mb-3">
                <label for="productStock" class="form-label">Stock</label>
                <input type="number" class="form-control" id="productStock" name="cantidad" required>
            </div>
            <div class="mb-3" style="display:none">
                <input type="number" class="form-control" id="productCategory" name="idCategoria" value="1" readonly>
            </div>
            <button type="submit" class="btn btn-primary">Vender</button>
        </form>

        <script src="subirFotosProducto.js"></script>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script>
document.getElementById('venderForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    // Obtener usuario logueado
    const usuario = JSON.parse(localStorage.getItem('usuario'));
    if (!usuario || !usuario.idUsuario) {
        alert('Debes iniciar sesión como vendedor.');
        return;
    }
    formData.set('idCategoria', 1); // Siempre enviar 1
    formData.append('idUsuario', usuario.idUsuario);
    try {
        const response = await fetch('http://localhost:8081/api/productos', {
            method: 'POST',
            body: formData
        });
        if (response.ok) {
            alert('Producto creado exitosamente');
            form.reset();
        } else {
            const error = await response.text();
            alert('Error al crear el producto: ' + error);
        }
    } catch (err) {
        alert('Error de red: ' + err);
    }
});
</script>
</body>

</html>
