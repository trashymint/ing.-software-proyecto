<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Inicio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container">
        <form>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">contraseña</label>
                <input type="password" class="form-control" id="exampleInputPassword1">
            </div>
            <div class="d-grid gap-2 d-md-block" style="text-align: end;">
                <button class="btn btn-primary" type="button" onclick="window.location.href='RecuperarContra.html'">Recuperar contraseña</button>
            </div>

            
            <div class="d-grid gap-2" style="margin-top: 20px;">
                <button class="btn btn-primary" type="button">Iniciar sesión</button>
            </div>
        </form>
    </div>

    <div class="visible" style="margin-top: 20px;">
        <div class="alert alert-danger" role="alert">
            <strong>¡Error!</strong> Usuario o contraseña incorrectos.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="..." crossorigin="anonymous"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const loginBtn = document.querySelector('button.btn.btn-primary[type="button"]:not([onclick])');
        const emailInput = document.getElementById('exampleInputEmail1');
        const passwordInput = document.getElementById('exampleInputPassword1');
        const errorDiv = document.querySelector('.alert-danger').parentElement;
        errorDiv.style.display = 'none';

        loginBtn.addEventListener('click', function() {
            const correo = emailInput.value.trim();
            const contrasenia = passwordInput.value;
            fetch('http://localhost:8081/api/usuarios/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo, contrasenia })
            })
            .then(async res => {
                if (res.ok) {
                    const usuario = await res.json();
                    localStorage.setItem('usuario', JSON.stringify(usuario));
                    window.location.href = 'index.html';
                } else {
                    errorDiv.style.display = 'block';
                }
            })
            .catch(() => {
                errorDiv.style.display = 'block';
            });
        });
    });
    </script>
</body>

</html>
