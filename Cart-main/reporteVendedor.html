<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Inicio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center">Generar Reporte de Fraude</h1>
        <form id="fraudReportForm">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre del cliente</label>
                <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>

            <div class="mb-3">
                <label for="tipoFraude" class="form-label">Tipo de Fraude</label>
                <select class="form-select" id="tipoFraude" required>
                    <option value="" selected disabled>Seleccione una opción</option>
                    <option value="pago_fraudulento">Pago fraudulento</option>
                    <option value="reclamo_injustificado">Reclamo injustificado para obtener reembolso</option>
                    <option value="no_pago">No pago del producto/servicio recibido</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción del Fraude</label>
                <textarea class="form-control" id="descripcion" rows="3" required></textarea>
            </div>

            <div class="mb-3">
                <label for="fecha" class="form-label">Fecha del Incidente</label>
                <input type="date" class="form-control" id="fecha" required>
            </div>

            <label for="productImages" class="form-label">Evidencia</label>
            <div id="gallery" class="mb-3 d-flex flex-wrap gap-2"></div>
            <div class="mb-3">
                <input type="file" class="form-control" id="productImages" multiple accept="image/*" required>
            </div>

            <button type="submit" class="btn btn-primary">Enviar Reporte</button>
        </form>
    </div>

    <script src="assets/js/subirFotosProducto.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
